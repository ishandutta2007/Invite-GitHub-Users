<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Inviter | Professional Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #22c55e;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --terminal-bg: #020617;
            --terminal-text: #34d399;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 60px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-top: 8px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(8px);
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .label-hint {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f8fafc;
            color: var(--text-main);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-container {
            margin-top: 12px;
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .terminal-container {
            background: var(--terminal-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .terminal-header {
            background: #1e293b;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .terminal {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 20px;
            height: 350px;
            overflow-y: auto;
            color: var(--terminal-text);
            line-height: 1.6;
        }

        .terminal::-webkit-scrollbar {
            width: 8px;
        }
        .terminal::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .log-entry {
            margin-bottom: 6px;
            display: flex;
            gap: 8px;
        }

        .log-entry span.prefix {
            color: #6366f1;
            user-select: none;
        }

        .summary-card {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>InvitePilot</h1>
            <p>High-performance GitHub collaborator management</p>
        </header>

        <div class="card">
            <div class="section-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                Configuration
            </div>
            
            <div class="form-group">
                <label for="token">Admin Token <span class="label-hint">(Defaults to .env if empty)</span></label>
                <input type="password" id="token" placeholder="github_pat_...">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="owner">Owner <span class="label-hint">(e.g., ishandutta2007)</span></label>
                    <input type="text" id="owner" placeholder="ishandutta2007">
                </div>
                <div class="form-group">
                    <label for="repo">Repository <span class="label-hint">(e.g., Top-AI-repos)</span></label>
                    <input type="text" id="repo" placeholder="Top-AI-repos">
                </div>
                <div class="form-group full-width">
                    <label for="usernames">Target Usernames <span class="label-hint">(One per line, overrides Input File)</span></label>
                    <textarea id="usernames" rows="3" placeholder="octocat&#10;monalisa"></textarea>
                </div>
                <div class="form-group">
                    <label for="max_invites">Max Invites</label>
                    <input type="number" id="max_invites" value="60">
                </div>
                <div class="form-group">
                    <label for="delay">Delay <span class="label-hint">(seconds)</span></label>
                    <input type="number" id="delay" value="3" step="0.5">
                </div>
                <div class="form-group">
                    <label for="tbi_file">Input File Path</label>
                    <input type="text" id="tbi_file" placeholder="to_be_invited.txt">
                </div>
                <div class="form-group">
                    <label for="success_file">Success Log Path</label>
                    <input type="text" id="success_file" placeholder="successful_invites.txt">
                </div>
            </div>

            <div class="btn-container">
                <button id="start-btn" class="btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Initialize Automation
                </button>
            </div>
        </div>

        <div class="card">
            <div class="section-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                Real-time Console
            </div>
            
            <div class="terminal-container">
                <div class="terminal-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div id="terminal" class="terminal">System idle. Waiting for initialization...</div>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const terminal = document.getElementById('terminal');

        startBtn.addEventListener('click', async () => {
            const config = {
                token: document.getElementById('token').value,
                owner: document.getElementById('owner').value,
                repo: document.getElementById('repo').value,
                max_invites: document.getElementById('max_invites').value,
                delay: document.getElementById('delay').value,
                tbi_file: document.getElementById('tbi_file').value,
                success_file: document.getElementById('success_file').value,
                usernames: document.getElementById('usernames').value
            };

            terminal.innerHTML = '';
            appendLog('Connecting to GitHub API engine...');
            startBtn.disabled = true;

            try {
                const response = await fetch('/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                appendLog(data.message);
                            } catch (e) {
                                console.error('Error parsing JSON:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                appendLog('CRITICAL ERROR: ' + error.message);
            } finally {
                startBtn.disabled = false;
                appendLog('Process lifecycle completed.');
            }
        });

        function appendLog(message) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            
            const prefix = document.createElement('span');
            prefix.className = 'prefix';
            prefix.textContent = 'λ';
            
            const content = document.createElement('span');
            content.textContent = message;
            
            div.appendChild(prefix);
            div.appendChild(content);
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
